name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check Format
        run: |
          $HOME/.moon/bin/moon fmt --deny-warn

      - name: Check Interface Info
        run: |
          $HOME/.moon/bin/moon info --deny-warn

      - name: Run Tests
        run: |
          $HOME/.moon/bin/moon test
